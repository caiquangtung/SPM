services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spm-postgres
    environment:
      POSTGRES_USER: spm_user
      POSTGRES_PASSWORD: spm_pass
      POSTGRES_DB: spm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spm_user -d spm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spm-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: spm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - spm-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: spm-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listen on two different ports inside the container and advertise
      # an external host-accessible listener on 29092 to avoid binding the
      # same port for multiple listeners (fixes "Each listener must have a different port").
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit
            1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - spm-network

  # api-gateway: Not implemented yet
  # Uncomment when service is ready
  # api-gateway:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.dev
    container_name: spm-api-gateway
    depends_on:
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT__Issuer=spm-api-gateway
      - JWT__Audience=spm-services
    volumes:
      # Mount source code for hot reload
      - ./services/api-gateway:/app
      - /app/bin
      - /app/obj
    networks:
      - spm-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    container_name: spm-user-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=spm_db;Username=spm_user;Password=spm_pass
      - Kafka__BootstrapServers=kafka:9092
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT__Issuer=spm-api-gateway
      - JWT__Audience=spm-services
    volumes:
      # Mount source code for hot reload
      - ./services/user-service:/app
      - /app/bin
      - /app/obj
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spm-network

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile.dev
    container_name: spm-project-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=spm_db;Username=spm_user;Password=spm_pass
      - Kafka__BootstrapServers=kafka:9092
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT__Issuer=spm-api-gateway
      - JWT__Audience=spm-services
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
    volumes:
      # Mount source code for hot reload
      - ./services/project-service:/app
      - /app/bin
      - /app/obj
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spm-network

  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile.dev
    container_name: spm-file-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=spm_db;Username=spm_user;Password=spm_pass
      - Kafka__BootstrapServers=kafka:9092
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT__Issuer=spm-api-gateway
      - JWT__Audience=spm-services
      - FileStorage__Path=/app/storage
    volumes:
      # Mount source code for hot reload
      - ./services/file-service:/app
      - /app/bin
      - /app/obj
      - file_storage:/app/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spm-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    container_name: spm-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=spm_db;Username=spm_user;Password=spm_pass
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=notification-service
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT__Issuer=spm-api-gateway
      - JWT__Audience=spm-services
    volumes:
      - ./services/notification-service:/app
      - /app/bin
      - /app/obj
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spm-network

  # ai-service:
  #   build: ./services/ai-service
  #   container_name: spm-ai-service
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "5005:8000"
  #   environment:
  #     - GEMINI_API_KEY=${GEMINI_API_KEY}
  #     - DATABASE_URL=postgresql://spm_user:spm_pass@postgres:5432/spm_db
  #     - PYTHONUNBUFFERED=1
  #   networks:
  #     - spm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: spm-frontend
    depends_on:
      - api-gateway
      - user-service
      - notification-service
    ports:
      - "3000:3000"
    environment:
      # Browser runs on host, so use localhost:5000 (API Gateway)
      # API Gateway routes to all services
      - NEXT_PUBLIC_API_URL=http://localhost:5010
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - spm-network

volumes:
  postgres_data:
  file_storage:

networks:
  spm-network:
    driver: bridge
